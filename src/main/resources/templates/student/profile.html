<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông tin cá nhân</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/student-nav :: nav('profile')}"></div>
<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/student}">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Thông tin cá nhân</li>
    </ol></nav>
    <h1 class="h4 mb-3">Thông tin cá nhân</h1>

    <table class="table table-bordered w-auto">
        <tr><th>Mã sinh viên</th><td th:text="${student.maSV}"></td></tr>
        <tr><th>Họ tên</th><td th:text="${student.hoTen}"></td></tr>
        <tr><th>Ngày sinh</th>
            <td th:text="${student.ngaySinh != null} ? ${#temporals.format(student.ngaySinh, 'dd/MM/yyyy')} : '-'"></td></tr>
        <tr><th>Giới tính</th><td th:text="${student.gioiTinh} ?: '-'"></td></tr>
        <tr><th>Email</th><td th:text="${student.email} ?: '-'"></td></tr>
        <tr><th>Số điện thoại</th><td th:text="${student.soDienThoai} ?: '-'"></td></tr>
        <tr><th>Địa chỉ</th><td th:text="${student.diaChi} ?: '-'"></td></tr>
        <tr><th>Khoa</th><td th:text="${student.khoa != null} ? ${student.khoa.tenKhoa} : '-'"></td></tr>
        <tr><th>Khóa học</th><td th:text="${student.khoaHoc} ?: '-'"></td></tr>
        <tr><th>Trạng thái</th>
            <td><span class="badge" th:classappend="${student.trangThai == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${student.trangThai}"></span></td></tr>
    </table>

    <a class="btn btn-secondary" th:href="@{/student}">Quay lại trang chủ</a>
</div>
</body>
</html>
