<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử đăng ký học phần</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Lịch sử đăng ký học phần</h1>
        <a class="btn btn-outline-primary" th:href="@{/student/registrations}">Học phần đã đăng ký</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-light">
            <tr>
                <th>Mã đăng ký</th>
                <th>Mã lớp</th>
                <th>Môn học</th>
                <th>Học kỳ</th>
                <th>Ngày đăng ký</th>
                <th>Ngày hủy</th>
                <th>Trạng thái</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="registration : ${registrations}">
                <td th:text="${registration.maDangKy}"></td>
                <td th:text="${registration.lopHocPhan.maLopHocPhan}"></td>
                <td th:text="${registration.lopHocPhan.monHoc.maMonHoc + ' - '
                    + registration.lopHocPhan.monHoc.tenMonHoc}"></td>
                <td th:text="${registration.lopHocPhan.hocKy.tenHocKy + ' - '
                    + registration.lopHocPhan.hocKy.namHoc}"></td>
                <td th:text="${registration.ngayDangKy != null
                    ? #temporals.format(registration.ngayDangKy, 'dd/MM/yyyy HH:mm') : ''}"></td>
                <td th:text="${registration.ngayHuy != null
                    ? #temporals.format(registration.ngayHuy, 'dd/MM/yyyy HH:mm') : ''}"></td>
                <td th:text="${registration.trangThai}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(registrations)}">
                <td colspan="7" class="text-center text-muted">Chưa có lịch sử đăng ký.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/student/course-sections}">Tìm lớp học phần để đăng ký</a>
</div>
</body>
</html>
