<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử đăng ký học phần</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/student-nav :: nav('history')}"></div>
<main class="app-page app-student-content">
    <nav aria-label="Điều hướng" class="app-breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/student}">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Lịch sử đăng ký</li>
    </ol></nav>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="app-page-title mb-0">Lịch sử đăng ký học phần</h1>
        <a class="btn btn-outline-primary" th:href="@{/student/registrations}">Học phần đã đăng ký</a>
    </div>

    <div class="app-table-card table-responsive">
        <table class="table table-hover align-middle app-data-table">
            <thead>
            <tr>
                <th>Mã lớp học phần</th>
                <th>Môn học</th>
                <th>Học kỳ</th>
                <th>Ngày đăng ký</th>
                <th>Ngày hủy</th>
                <th>Trạng thái</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="registration : ${registrations}">
                <td th:text="${registration.lopHocPhan.maLopHocPhan}"></td>
                <td th:text="${registration.lopHocPhan.monHoc.maMonHoc + ' - '
                    + registration.lopHocPhan.monHoc.tenMonHoc}"></td>
                <td th:text="${registration.lopHocPhan.hocKy.tenHocKy + ' - '
                    + registration.lopHocPhan.hocKy.namHoc}"></td>
                <td th:text="${registration.ngayDangKy != null
                    ? #temporals.format(registration.ngayDangKy, 'dd/MM/yyyy') : '-'}"></td>
                <td th:text="${registration.ngayHuy != null
                    ? #temporals.format(registration.ngayHuy, 'dd/MM/yyyy') : '-'}"></td>
                <td>
                    <span class="badge app-status"
                          th:classappend="${registration.trangThai == 'REGISTERED'} ? 'bg-success'
                              : (${registration.trangThai == 'CANCELLED'} ? 'bg-secondary' : 'bg-light text-dark')"
                          th:text="${registration.trangThai}"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(registrations)}">
                <td colspan="6" class="text-center text-muted py-4">Chưa có lịch sử đăng ký học phần.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="app-actions mt-3">
        <a class="btn btn-outline-secondary" th:href="@{/student}">Quay lại trang chủ</a>
        <a class="btn btn-outline-primary" th:href="@{/student/course-sections}">Tìm lớp học phần</a>
    </div>
</main>
</body>
</html>
