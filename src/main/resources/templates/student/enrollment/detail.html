<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết lớp học phần</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/student-nav :: nav('register')}"></div>
<main class="app-page app-student-content">
    <nav aria-label="Điều hướng" class="app-breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/student}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/student/course-sections}">Đăng ký học phần</a></li>
        <li class="breadcrumb-item active" aria-current="page">Chi tiết lớp học phần</li>
    </ol></nav>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="app-section-detail-card app-detail-card mb-3" aria-labelledby="section-detail-title">
    <div class="app-section-detail-heading">
        <h1 id="section-detail-title" class="app-section-title mb-0">Chi tiết lớp học phần</h1>
        <a class="btn-close" th:href="@{/student/course-sections}" aria-label="Đóng"></a>
    </div>
    <div class="table-responsive">
    <table class="table table-bordered app-detail-table app-section-detail-table">
        <tr><th>Mã lớp học phần</th><td th:text="${courseSection.maLopHocPhan}"></td></tr>
        <tr><th>Môn học</th>
            <td th:text="${courseSection.monHoc.maMonHoc + ' - ' + courseSection.monHoc.tenMonHoc}"></td></tr>
        <tr><th>Số tín chỉ</th><td th:text="${courseSection.monHoc.soTinChi}"></td></tr>
        <tr><th>Học kỳ</th>
            <td th:text="${courseSection.hocKy.tenHocKy + ' - ' + courseSection.hocKy.namHoc}"></td></tr>
        <tr><th>Giảng viên</th>
            <td th:text="${courseSection.giangVien != null ? courseSection.giangVien.hoTen : 'Chưa phân công'}"></td></tr>
        <tr><th>Lịch học</th>
            <td th:text="${courseSection.thuHoc == null ? 'Chưa xếp lịch'
                : (courseSection.thuHoc == 8 ? 'Chủ nhật' : 'Thứ ' + courseSection.thuHoc)
                    + (courseSection.tietBatDau != null or courseSection.tietKetThuc != null
                        ? ', tiết ' + (courseSection.tietBatDau != null ? courseSection.tietBatDau : '-')
                            + ' - ' + (courseSection.tietKetThuc != null ? courseSection.tietKetThuc : '-') : '')}"></td></tr>
        <tr><th>Phòng học</th><td th:text="${courseSection.phongHoc} ?: '-'"></td></tr>
        <tr><th>Sĩ số tối đa</th><td th:text="${courseSection.siSoToiDa}"></td></tr>
        <tr><th>Sĩ số hiện tại</th><td th:text="${courseSection.siSoHienTai}"></td></tr>
        <tr><th>Trạng thái</th>
            <td><span class="badge app-status"
                      th:classappend="${courseSection.trangThai == 'OPEN'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${courseSection.trangThai}"></span></td></tr>
    </table>
    </div>

    <div class="app-actions app-section-detail-actions">
        <form method="post"
              th:action="@{/student/course-sections/{id}/register(id=${courseSection.maLopHocPhan})}">
            <button type="submit" class="btn btn-primary">Đăng ký học phần</button>
        </form>
        <a class="btn btn-outline-secondary" th:href="@{/student/course-sections}">Đóng</a>
    </div>
    </section>
</main>
</body>
</html>
