<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký học phần</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/student-nav :: nav('register')}"></div>
<main class="app-page app-student-content">
    <nav aria-label="Điều hướng" class="app-breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/student}">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Đăng ký học phần</li>
    </ol></nav>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="app-page-title mb-0">Danh sách lớp học phần đang mở</h1>
        <a class="btn btn-outline-primary" th:href="@{/student/registrations}">Học phần đã đăng ký</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="app-filter-card row g-2 mb-3" method="get" th:action="@{/student/course-sections}">
        <div class="col-md-5">
            <label class="form-label" for="section-keyword">Mã lớp hoặc môn học</label>
            <input type="text" class="form-control" id="section-keyword" name="keyword" th:value="${keyword}"
                   placeholder="Mã lớp hoặc môn học">
        </div>
        <div class="col-md-4">
            <label class="form-label" for="semester-filter">Học kỳ</label>
            <select class="form-select" id="semester-filter" name="maHocKy">
                <option value="">-- Tất cả học kỳ --</option>
                <option th:each="semester : ${semesters}" th:value="${semester.maHocKy}"
                        th:selected="${semester.maHocKy == maHocKy}"
                        th:text="${semester.tenHocKy + ' - ' + semester.namHoc}"></option>
            </select>
        </div>
        <div class="col-md-3 align-self-end">
            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            <a class="btn btn-outline-secondary" th:href="@{/student/course-sections}">Đặt lại</a>
        </div>
    </form>

    <div class="app-table-card table-responsive">
        <table class="table table-hover align-middle app-data-table">
        <thead>
            <tr>
                <th>Mã lớp HP</th>
                <th>Môn học</th>
                <th>Giảng viên</th>
                <th>Số tín chỉ</th>
                <th>Sĩ số</th>
                <th>Lịch học</th>
                <th>Phòng</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="section : ${courseSections}">
                <td th:text="${section.maLopHocPhan}"></td>
                <td th:text="${section.monHoc.maMonHoc + ' - ' + section.monHoc.tenMonHoc}"></td>
                <td th:text="${section.giangVien != null ? section.giangVien.hoTen : 'Chưa phân công'}"></td>
                <td th:text="${section.monHoc.soTinChi}"></td>
                <td th:text="${section.siSoHienTai + ' / ' + section.siSoToiDa}"></td>
                <td>
                    <span th:if="${section.thuHoc == null}">Chưa xếp lịch</span>
                    <span th:unless="${section.thuHoc == null}"
                          th:text="${(section.thuHoc == 8 ? 'Chủ nhật' : 'Thứ ' + section.thuHoc)
                            + (section.tietBatDau != null or section.tietKetThuc != null
                                ? ', tiết ' + section.tietBatDau + ' - ' + section.tietKetThuc : '')}"></span>
                </td>
                <td th:text="${section.phongHoc} ?: 'Chưa xếp'"></td>
                <td>
                    <div class="app-actions">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/student/course-sections/{id}(id=${section.maLopHocPhan})}">Xem chi tiết</a>
                        <form method="post"
                              th:action="@{/student/course-sections/{id}/register(id=${section.maLopHocPhan})}">
                            <button type="submit" class="btn btn-sm btn-primary">Đăng ký</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(courseSections)}">
                <td colspan="8" class="text-center text-muted py-4">Hiện chưa có lớp học phần đang mở.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a class="btn btn-outline-secondary mt-3" th:href="@{/student}">Quay lại trang chủ</a>
</main>
</body>
</html>
