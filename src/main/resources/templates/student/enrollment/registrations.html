<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Học phần đã đăng ký</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/student-nav :: nav('registrations')}"></div>
<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/student}">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Học phần đã đăng ký</li>
    </ol></nav>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Học phần đã đăng ký</h1>
        <a class="btn btn-outline-primary" th:href="@{/student/course-sections}">Đăng ký học phần</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <p class="fw-semibold">Tổng số tín chỉ đã đăng ký: <span th:text="${totalCredits}"></span></p>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-light">
            <tr>
                <th>Mã lớp</th>
                <th>Môn học</th>
                <th>Học kỳ</th>
                <th>Số tín chỉ</th>
                <th>Giảng viên</th>
                <th>Lịch học</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="registration : ${registrations}">
                <td th:text="${registration.lopHocPhan.maLopHocPhan}"></td>
                <td th:text="${registration.lopHocPhan.monHoc.maMonHoc + ' - '
                    + registration.lopHocPhan.monHoc.tenMonHoc}"></td>
                <td th:text="${registration.lopHocPhan.hocKy.tenHocKy + ' - '
                    + registration.lopHocPhan.hocKy.namHoc}"></td>
                <td th:text="${registration.lopHocPhan.monHoc.soTinChi}"></td>
                <td th:text="${registration.lopHocPhan.giangVien != null
                    ? registration.lopHocPhan.giangVien.hoTen : 'Chưa phân công'}"></td>
                <td>
                    <span th:if="${registration.lopHocPhan.thuHoc == null}">Chưa xếp lịch</span>
                    <span th:unless="${registration.lopHocPhan.thuHoc == null}"
                          th:text="${(registration.lopHocPhan.thuHoc == 8 ? 'Chủ nhật'
                            : 'Thứ ' + registration.lopHocPhan.thuHoc)
                            + (registration.lopHocPhan.tietBatDau != null
                                or registration.lopHocPhan.tietKetThuc != null
                                ? ', tiết ' + registration.lopHocPhan.tietBatDau
                                    + ' - ' + registration.lopHocPhan.tietKetThuc : '')}"></span>
                </td>
                <td th:text="${registration.trangThai}"></td>
                <td>
                    <form method="post"
                          th:action="@{/student/registrations/{id}/cancel(id=${registration.lopHocPhan.maLopHocPhan})}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Hủy đăng ký</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(registrations)}">
                <td colspan="8" class="text-center text-muted">Bạn chưa đăng ký học phần nào.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/student/enrollment-history}">Xem lịch sử đăng ký học phần</a>

    <a class="btn btn-secondary" th:href="@{/student}">Quay lại trang chủ</a>
</div>
</body>
</html>
