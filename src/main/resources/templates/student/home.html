<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/student-nav :: nav('home')}"></div>
<div class="container mt-4 mb-5">
    <h1 class="h4 mb-3">Trang sinh viên</h1>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Thông tin cá nhân</h5>
                    <p class="card-text text-muted">Xem thông tin sinh viên của bạn.</p>
                    <a class="btn btn-primary mt-auto" th:href="@{/student/profile}">Truy cập</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Đăng ký học phần</h5>
                    <p class="card-text text-muted">Tìm và đăng ký lớp học phần đang mở.</p>
                    <a class="btn btn-primary mt-auto" th:href="@{/student/course-sections}">Truy cập</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Học phần đã đăng ký</h5>
                    <p class="card-text text-muted">Xem và hủy các học phần đang đăng ký.</p>
                    <a class="btn btn-primary mt-auto" th:href="@{/student/registrations}">Truy cập</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Lịch sử đăng ký</h5>
                    <p class="card-text text-muted">Xem lịch sử đăng ký học phần.</p>
                    <a class="btn btn-primary mt-auto" th:href="@{/student/enrollment-history}">Truy cập</a>
                </div>
            </div>
        </div>
    </div>
    <form class="mt-4" method="post" th:action="@{/logout}">
        <button type="submit" class="btn btn-outline-secondary">Đăng xuất</button>
    </form>
</div>
</body>
</html>
