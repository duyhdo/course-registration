<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hệ thống Đăng ký Học phần</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="app-auth-shell">
    <section class="app-auth-card">
        <div class="card-body p-4 p-sm-5">
            <h1 class="h4 mb-4">Hệ thống Đăng ký Học phần</h1>

            <div class="alert alert-danger" th:if="${param.error}">
                Tên đăng nhập hoặc mật khẩu không đúng, hoặc tài khoản bị khóa.
            </div>
            <div class="alert alert-success" th:if="${param.logout}">
                Bạn đã đăng xuất thành công.
            </div>
            <div class="alert alert-success" th:if="${param.resetSuccess}">
                Đặt lại mật khẩu thành công. Vui lòng đăng nhập lại.
            </div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                <div class="text-center mt-3"><a th:href="@{/forgot-password}">Quên mật khẩu?</a></div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
