<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác nhận mã khôi phục</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 400px;">
    <h1 class="h4 mb-3">Xác nhận mã khôi phục</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <p>Nhập mã xác nhận 6 chữ số đã được gửi đến email của bạn.</p>
    <form method="post" th:action="@{/forgot-password/verify}">
        <div class="mb-3">
            <label for="code" class="form-label">Mã xác nhận</label>
            <input type="text" class="form-control" id="code" name="code" maxlength="6"
                   inputmode="numeric" autocomplete="one-time-code" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2">Xác nhận</button>
        <a class="btn btn-secondary w-100" th:href="@{/forgot-password}">Quay lại</a>
    </form>
</div>
</body>
</html>
