<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 400px;">
    <h1 class="h4 mb-3">Quên mật khẩu</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form method="post" th:action="@{/forgot-password}">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${email}"
                   placeholder="Nhập email đã đăng ký" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2">Gửi mã xác nhận</button>
        <a class="btn btn-secondary w-100" th:href="@{/login}">Quay lại đăng nhập</a>
    </form>
</div>
</body>
</html>
