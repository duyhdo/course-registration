<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cấu hình đăng ký học kỳ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('semesters')}"></div>
<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/semesters}">Học kỳ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Cấu hình đăng ký</li>
    </ol></nav>
    <h1 class="h4 mb-3">Cấu hình đăng ký học kỳ</h1>

    <table class="table table-bordered w-auto">
        <tr><th>Mã học kỳ</th><td th:text="${semester.maHocKy}"></td></tr>
        <tr><th>Tên học kỳ</th><td th:text="${semester.tenHocKy}"></td></tr>
        <tr><th>Năm học</th><td th:text="${semester.namHoc}"></td></tr>
        <tr><th>Ngày bắt đầu</th>
            <td th:text="${semester.ngayBatDau != null} ? ${#temporals.format(semester.ngayBatDau, 'dd/MM/yyyy')} : '-'"></td></tr>
        <tr><th>Ngày kết thúc</th>
            <td th:text="${semester.ngayKetThuc != null} ? ${#temporals.format(semester.ngayKetThuc, 'dd/MM/yyyy')} : '-'"></td></tr>
    </table>

    <div class="alert alert-info">
        Tín chỉ tối đa được sử dụng để kiểm tra các lượt đăng ký mới.
        Tín chỉ tối thiểu hiện được lưu cấu hình và chưa được kiểm tra
        trong từng thao tác đăng ký/hủy.
    </div>

    <form method="post" th:object="${configForm}"
          th:action="@{/admin/semesters/{id}/edit(id=${semester.maHocKy})}">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="ngayMoDangKy">Ngày mở đăng ký</label>
            <input type="datetime-local" class="form-control" id="ngayMoDangKy" th:field="*{ngayMoDangKy}"
                   th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{ngayMoDangKy}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="ngayDongDangKy">Ngày đóng đăng ký</label>
            <input type="datetime-local" class="form-control" id="ngayDongDangKy" th:field="*{ngayDongDangKy}"
                   th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{ngayDongDangKy}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="tinChiToiThieu">Tín chỉ tối thiểu</label>
            <input type="number" class="form-control" id="tinChiToiThieu" th:field="*{tinChiToiThieu}"
                   min="0" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{tinChiToiThieu}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="tinChiToiDa">Tín chỉ tối đa</label>
            <input type="number" class="form-control" id="tinChiToiDa" th:field="*{tinChiToiDa}"
                   min="1" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{tinChiToiDa}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Lưu cấu hình</button>
        <a class="btn btn-secondary" th:href="@{/admin/semesters}">Quay lại</a>
    </form>
</div>
</body>
</html>
