<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý môn học</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('subjects')}"></div>
<main class="app-page app-admin-content">
    <nav aria-label="Điều hướng" class="app-breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Môn học</li>
    </ol></nav>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="app-page-title mb-0">Quản lý môn học</h1>
        <a class="btn btn-primary" th:href="@{/admin/subjects/new}">Thêm môn học</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="app-filter-card row g-2 mb-3" method="get" th:action="@{/admin/subjects}">
        <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label" for="subject-keyword">Mã môn học hoặc tên môn học</label>
            <input type="text" class="form-control" id="subject-keyword" name="keyword" th:value="${keyword}"
                   placeholder="Mã môn học hoặc tên môn học">
        </div>
        <div class="col-12 col-md-auto align-self-end">
            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/subjects}">Đặt lại</a>
        </div>
    </form>

    <div class="app-table-card table-responsive">
    <table class="table table-hover align-middle app-data-table">
        <thead>
        <tr>
            <th>Mã môn học</th>
            <th>Tên môn học</th>
            <th>Khoa</th>
            <th>Số tín chỉ</th>
            <th>Lý thuyết</th>
            <th>Thực hành</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="subject : ${subjects}">
            <td th:text="${subject.maMonHoc}"></td>
            <td th:text="${subject.tenMonHoc}"></td>
            <td th:text="${subject.khoa.tenKhoa}"></td>
            <td th:text="${subject.soTinChi}"></td>
            <td th:text="${subject.soTietLyThuyet}"></td>
            <td th:text="${subject.soTietThucHanh}"></td>
            <td>
                <span class="badge app-status"
                      th:classappend="${subject.trangThai == 'ACTIVE'} ? 'bg-success' : (${subject.trangThai == 'INACTIVE'} ? 'bg-secondary' : 'bg-light text-dark')"
                      th:text="${subject.trangThai}"></span>
            </td>
            <td>
                <div class="app-actions">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/admin/subjects/{id}(id=${subject.maMonHoc})}">Xem</a>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/admin/subjects/{id}/edit(id=${subject.maMonHoc})}">Sửa</a>
                    <form method="post" th:action="@{/admin/subjects/{id}/toggle-status(id=${subject.maMonHoc})}">
                        <button type="submit" class="btn btn-sm btn-outline-warning"
                                th:text="${subject.trangThai == 'ACTIVE'} ? 'Ngừng sử dụng' : 'Kích hoạt'"></button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(subjects)}">
            <td colspan="8" class="text-center text-muted">Không có môn học nào.</td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
