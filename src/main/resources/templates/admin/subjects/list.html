<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý môn học</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('subjects')}"></div>
<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Môn học</li>
    </ol></nav>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Quản lý môn học</h1>
        <a class="btn btn-primary" th:href="@{/admin/subjects/new}">Thêm môn học</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="row g-2 mb-3" method="get" th:action="@{/admin/subjects}">
        <div class="col-auto">
            <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                   placeholder="Mã môn học hoặc tên môn học">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Tìm kiếm</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/subjects}">Đặt lại</a>
        </div>
    </form>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-light">
        <tr>
            <th>Mã môn học</th>
            <th>Tên môn học</th>
            <th>Khoa</th>
            <th>Số tín chỉ</th>
            <th>Lý thuyết</th>
            <th>Thực hành</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="subject : ${subjects}">
            <td th:text="${subject.maMonHoc}"></td>
            <td th:text="${subject.tenMonHoc}"></td>
            <td th:text="${subject.khoa.tenKhoa}"></td>
            <td th:text="${subject.soTinChi}"></td>
            <td th:text="${subject.soTietLyThuyet}"></td>
            <td th:text="${subject.soTietThucHanh}"></td>
            <td>
                <span class="badge"
                      th:classappend="${subject.trangThai == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${subject.trangThai}"></span>
            </td>
            <td class="text-nowrap">
                <a class="btn btn-sm btn-outline-info"
                   th:href="@{/admin/subjects/{id}(id=${subject.maMonHoc})}">Xem</a>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/admin/subjects/{id}/edit(id=${subject.maMonHoc})}">Sửa</a>
                <form class="d-inline" method="post"
                      th:action="@{/admin/subjects/{id}/toggle-status(id=${subject.maMonHoc})}">
                    <button type="submit" class="btn btn-sm btn-outline-warning"
                            th:text="${subject.trangThai == 'ACTIVE'} ? 'Ngừng sử dụng' : 'Kích hoạt'"></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(subjects)}">
            <td colspan="8" class="text-center text-muted">Không có môn học nào.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
