<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Môn học</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('subjects')}"></div>
<main class="app-page app-admin-content">
    <nav aria-label="Điều hướng" class="app-breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/subjects}">Môn học</a></li>
        <li class="breadcrumb-item active" aria-current="page">Biểu mẫu môn học</li>
    </ol></nav>
    <h1 class="app-page-title mb-3" th:text="${editMode} ? 'Cập nhật môn học' : 'Thêm môn học'"></h1>

    <form class="app-form-card" method="post" th:object="${monHocForm}"
          th:action="${editMode} ? @{/admin/subjects/{id}/edit(id=${maMonHoc})} : @{/admin/subjects}">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
        </div>

        <div class="row app-form-grid">
        <div class="col-12 col-md-6">
            <label class="form-label" for="maMonHoc">Mã môn học</label>
            <input type="text" class="form-control" id="maMonHoc" th:field="*{maMonHoc}"
                   th:readonly="${editMode}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{maMonHoc}"></div>
        </div>

        <div class="col-12 col-md-6">
            <label class="form-label" for="maKhoa">Khoa</label>
            <select class="form-select" id="maKhoa" th:field="*{maKhoa}" th:errorclass="is-invalid">
                <option value="">-- Chọn khoa --</option>
                <option th:each="khoa : ${khoaList}" th:value="${khoa.maKhoa}"
                        th:text="${khoa.trangThai == 'INACTIVE' ? khoa.maKhoa + ' - ' + khoa.tenKhoa + ' (Ngừng hoạt động)' : khoa.tenKhoa}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{maKhoa}"></div>
        </div>

        <div class="col-12 col-md-6">
            <label class="form-label" for="tenMonHoc">Tên môn học</label>
            <input type="text" class="form-control" id="tenMonHoc" th:field="*{tenMonHoc}"
                   th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{tenMonHoc}"></div>
        </div>

        <div class="col-12 col-md-6">
            <label class="form-label" for="soTinChi">Số tín chỉ</label>
            <input type="number" class="form-control" id="soTinChi" th:field="*{soTinChi}"
                   min="1" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{soTinChi}"></div>
        </div>

        <div class="col-12 col-md-6">
            <label class="form-label" for="soTietLyThuyet">Số tiết lý thuyết</label>
            <input type="number" class="form-control" id="soTietLyThuyet" th:field="*{soTietLyThuyet}"
                   min="0" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{soTietLyThuyet}"></div>
        </div>

        <div class="col-12 col-md-6">
            <label class="form-label" for="soTietThucHanh">Số tiết thực hành</label>
            <input type="number" class="form-control" id="soTietThucHanh" th:field="*{soTietThucHanh}"
                   min="0" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{soTietThucHanh}"></div>
        </div>

        <div class="col-12">
            <label class="form-label" for="moTa">Mô tả</label>
            <textarea class="form-control" id="moTa" th:field="*{moTa}" rows="3"
                      th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{moTa}"></div>
        </div>

        </div>

        <div class="app-actions mt-4">
            <a class="btn btn-outline-secondary"
               th:href="${editMode} ? @{/admin/subjects/{id}(id=${maMonHoc})} : @{/admin/subjects}">Quay lại</a>
            <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
    </form>
</main>
</body>
</html>
