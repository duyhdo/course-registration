<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết môn học</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('subjects')}"></div>
<main class="app-page app-admin-content">
    <nav aria-label="Điều hướng" class="app-breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/subjects}">Môn học</a></li>
        <li class="breadcrumb-item active" aria-current="page">Chi tiết môn học</li>
    </ol></nav>
    <h1 class="app-page-title mb-3">Chi tiết môn học</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="app-detail-card mb-3">
    <div class="table-responsive">
    <table class="table table-bordered app-detail-table">
        <tr><th>Mã môn học</th><td th:text="${subject.maMonHoc}"></td></tr>
        <tr><th>Tên môn học</th><td th:text="${subject.tenMonHoc}"></td></tr>
        <tr><th>Khoa</th><td th:text="${subject.khoa.maKhoa + ' - ' + subject.khoa.tenKhoa}"></td></tr>
        <tr><th>Số tín chỉ</th><td th:text="${subject.soTinChi}"></td></tr>
        <tr><th>Số tiết lý thuyết</th><td th:text="${subject.soTietLyThuyet}"></td></tr>
        <tr><th>Số tiết thực hành</th><td th:text="${subject.soTietThucHanh}"></td></tr>
        <tr><th>Mô tả</th><td th:text="${subject.moTa}"></td></tr>
        <tr>
            <th>Trạng thái</th>
            <td>
                <span class="badge app-status"
                      th:classappend="${subject.trangThai == 'ACTIVE'} ? 'bg-success' : (${subject.trangThai == 'INACTIVE'} ? 'bg-secondary' : 'bg-light text-dark')"
                      th:text="${subject.trangThai}"></span>
            </td>
        </tr>
    </table>
    </div>
    </div>

    <div class="app-actions">
        <a class="btn btn-outline-secondary" th:href="@{/admin/subjects}">Quay lại danh sách</a>
        <a class="btn btn-primary"
           th:href="@{/admin/subjects/{id}/edit(id=${subject.maMonHoc})}">Sửa thông tin</a>
    </div>
</main>
</body>
</html>
