<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('students')}"></div>
<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/students}">Sinh viên</a></li>
        <li class="breadcrumb-item active" aria-current="page">Biểu mẫu sinh viên</li>
    </ol></nav>
    <h1 class="h4 mb-3" th:text="${editMode} ? 'Cập nhật sinh viên' : 'Thêm sinh viên'"></h1>

    <form method="post" th:object="${studentForm}"
          th:action="${editMode} ? @{/admin/students/{id}/edit(id=${maSV})} : @{/admin/students}">

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="maSV">Mã sinh viên</label>
            <input type="text" class="form-control" id="maSV" th:field="*{maSV}"
                   th:readonly="${editMode}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{maSV}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="maKhoa">Khoa</label>
            <select class="form-select" id="maKhoa" th:field="*{maKhoa}" th:errorclass="is-invalid">
                <option value="">-- Chọn khoa --</option>
                <option th:each="k : ${khoaList}" th:value="${k.maKhoa}" th:text="${k.tenKhoa}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{maKhoa}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="hoTen">Họ tên</label>
            <input type="text" class="form-control" id="hoTen" th:field="*{hoTen}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{hoTen}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="ngaySinh">Ngày sinh</label>
            <input type="date" class="form-control" id="ngaySinh" th:field="*{ngaySinh}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{ngaySinh}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="gioiTinh">Giới tính</label>
            <select class="form-select" id="gioiTinh" th:field="*{gioiTinh}" th:errorclass="is-invalid">
                <option value="">-- Chọn --</option>
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
                <option value="Khác">Khác</option>
            </select>
            <div class="invalid-feedback" th:errors="*{gioiTinh}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="soDienThoai">Số điện thoại</label>
            <input type="text" class="form-control" id="soDienThoai" th:field="*{soDienThoai}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{soDienThoai}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="diaChi">Địa chỉ</label>
            <input type="text" class="form-control" id="diaChi" th:field="*{diaChi}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{diaChi}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="khoaHoc">Khóa học</label>
            <input type="text" class="form-control" id="khoaHoc" th:field="*{khoaHoc}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{khoaHoc}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a class="btn btn-secondary" th:href="${editMode} ? @{/admin/students/{id}(id=${maSV})} : @{/admin/students}">Hủy</a>
    </form>
</div>
</body>
</html>
