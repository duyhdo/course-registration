<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('students')}"></div>
<main class="app-page app-admin-content">
    <nav aria-label="Điều hướng" class="app-breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/students}">Sinh viên</a></li>
        <li class="breadcrumb-item active" aria-current="page">Chi tiết sinh viên</li>
    </ol></nav>
    <h1 class="app-page-title mb-3">Chi tiết sinh viên</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="app-detail-card mb-3">
    <div class="table-responsive">
    <table class="table table-bordered app-detail-table">
        <tr><th>Mã sinh viên</th><td th:text="${student.maSV}"></td></tr>
        <tr><th>Họ tên</th><td th:text="${student.hoTen}"></td></tr>
        <tr><th>Khoa</th><td th:text="${student.khoa.maKhoa + ' - ' + student.khoa.tenKhoa}"></td></tr>
        <tr><th>Ngày sinh</th><td th:text="${student.ngaySinh != null} ? ${#temporals.format(student.ngaySinh, 'dd/MM/yyyy')} : ''"></td></tr>
        <tr><th>Giới tính</th><td th:text="${student.gioiTinh}"></td></tr>
        <tr><th>Email</th><td th:text="${student.email}"></td></tr>
        <tr><th>Số điện thoại</th><td th:text="${student.soDienThoai}"></td></tr>
        <tr><th>Địa chỉ</th><td th:text="${student.diaChi}"></td></tr>
        <tr><th>Khóa học</th><td th:text="${student.khoaHoc}"></td></tr>
        <tr>
            <th>Trạng thái</th>
            <td>
                <span class="badge app-status"
                      th:classappend="${student.trangThai == 'ACTIVE'} ? 'bg-success' : (${student.trangThai == 'LOCKED'} ? 'bg-secondary' : 'bg-light text-dark')"
                      th:text="${student.trangThai}"></span>
            </td>
        </tr>
    </table>
    </div>
    </div>

    <div class="app-actions">
        <a class="btn btn-outline-secondary" th:href="@{/admin/students}">Quay lại danh sách</a>
        <a class="btn btn-primary" th:href="@{/admin/students/{id}/edit(id=${student.maSV})}">Sửa thông tin</a>
    </div>
</main>
</body>
</html>
