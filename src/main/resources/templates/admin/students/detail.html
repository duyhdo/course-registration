<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4 mb-5">
    <h1 class="h4 mb-3">Chi tiết sinh viên</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <table class="table table-bordered w-auto">
        <tr><th>Mã sinh viên</th><td th:text="${student.maSV}"></td></tr>
        <tr><th>Họ tên</th><td th:text="${student.hoTen}"></td></tr>
        <tr><th>Khoa</th><td th:text="${student.khoa.maKhoa + ' - ' + student.khoa.tenKhoa}"></td></tr>
        <tr><th>Ngày sinh</th><td th:text="${student.ngaySinh != null} ? ${#temporals.format(student.ngaySinh, 'dd/MM/yyyy')} : ''"></td></tr>
        <tr><th>Giới tính</th><td th:text="${student.gioiTinh}"></td></tr>
        <tr><th>Email</th><td th:text="${student.email}"></td></tr>
        <tr><th>Số điện thoại</th><td th:text="${student.soDienThoai}"></td></tr>
        <tr><th>Địa chỉ</th><td th:text="${student.diaChi}"></td></tr>
        <tr><th>Khóa học</th><td th:text="${student.khoaHoc}"></td></tr>
        <tr>
            <th>Trạng thái</th>
            <td>
                <span class="badge" th:classappend="${student.trangThai == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${student.trangThai}"></span>
            </td>
        </tr>
        <tr>
            <th>Tên đăng nhập</th>
            <td th:text="${student.taiKhoan?.tenDangNhap} ?: 'Chưa có tài khoản'"></td>
        </tr>
        <tr>
            <th>Vai trò</th>
            <td th:text="${student.taiKhoan?.vaiTro}"></td>
        </tr>
        <tr>
            <th>Trạng thái tài khoản</th>
            <td th:text="${student.taiKhoan?.trangThai}"></td>
        </tr>
    </table>

    <div>
        <a class="btn btn-primary" th:href="@{/admin/students/{id}/edit(id=${student.maSV})}">Sửa</a>
        <a class="btn btn-secondary" th:href="@{/admin/students}">Quay lại</a>
    </div>
</div>
</body>
</html>
