<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('students')}"></div>
<main class="app-page app-admin-content">
    <nav aria-label="Điều hướng" class="app-breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Sinh viên</li>
    </ol></nav>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="app-page-title mb-0">Quản lý sinh viên</h1>
        <a class="btn btn-primary" th:href="@{/admin/students/new}">Thêm sinh viên</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="app-filter-card row g-2 mb-3" method="get" th:action="@{/admin/students}">
        <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label" for="student-keyword">Mã sinh viên hoặc họ tên</label>
            <input type="text" class="form-control" id="student-keyword" name="keyword" th:value="${keyword}"
                   placeholder="Mã SV hoặc họ tên">
        </div>
        <div class="col-12 col-md-auto align-self-end">
            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/students}">Đặt lại</a>
        </div>
    </form>

    <div class="app-table-card table-responsive">
    <table class="table table-hover align-middle app-data-table">
        <thead>
        <tr>
            <th>Mã sinh viên</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Khoa</th>
            <th>Khóa học</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.maSV}"></td>
            <td th:text="${s.hoTen}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.khoa.tenKhoa}"></td>
            <td th:text="${s.khoaHoc}"></td>
            <td>
                <span class="badge app-status"
                      th:classappend="${s.trangThai == 'ACTIVE'} ? 'bg-success' : (${s.trangThai == 'LOCKED'} ? 'bg-secondary' : 'bg-light text-dark')"
                      th:text="${s.trangThai}"></span>
            </td>
            <td>
                <div class="app-actions">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/students/{id}(id=${s.maSV})}">Xem</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/students/{id}/edit(id=${s.maSV})}">Sửa</a>
                    <form method="post" th:action="@{/admin/students/{id}/toggle-status(id=${s.maSV})}">
                        <button type="submit" class="btn btn-sm btn-outline-warning"
                                th:text="${s.trangThai == 'ACTIVE'} ? 'Khóa sinh viên' : 'Mở khóa sinh viên'"></button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="7" class="text-center text-muted">Không có sinh viên nào.</td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
