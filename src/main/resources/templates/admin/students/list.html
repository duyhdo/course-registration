<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Quản lý sinh viên</h1>
        <a class="btn btn-primary" th:href="@{/admin/students/new}">Thêm sinh viên</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="row g-2 mb-3" method="get" th:action="@{/admin/students}">
        <div class="col-auto">
            <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                   placeholder="Mã SV hoặc họ tên">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Tìm kiếm</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/students}">Đặt lại</a>
        </div>
    </form>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-light">
        <tr>
            <th>MaSV</th>
            <th>HoTen</th>
            <th>Email</th>
            <th>Khoa</th>
            <th>KhoaHoc</th>
            <th>TrangThai</th>
            <th>ThaoTac</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.maSV}"></td>
            <td th:text="${s.hoTen}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.khoa.tenKhoa}"></td>
            <td th:text="${s.khoaHoc}"></td>
            <td>
                <span class="badge" th:classappend="${s.trangThai == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${s.trangThai}"></span>
            </td>
            <td class="text-nowrap">
                <a class="btn btn-sm btn-outline-info" th:href="@{/admin/students/{id}(id=${s.maSV})}">Xem</a>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/students/{id}/edit(id=${s.maSV})}">Sửa</a>
                <form class="d-inline" method="post" th:action="@{/admin/students/{id}/toggle-status(id=${s.maSV})}">
                    <button type="submit" class="btn btn-sm btn-outline-warning"
                            th:text="${s.trangThai == 'ACTIVE'} ? 'Khóa' : 'Mở'"></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="7" class="text-center text-muted">Không có sinh viên nào.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
