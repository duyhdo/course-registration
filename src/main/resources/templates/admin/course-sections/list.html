<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý lớp học phần</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('sections')}"></div>
<main class="app-page app-admin-content">
    <nav aria-label="Điều hướng" class="app-breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Lớp học phần</li>
    </ol></nav>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="app-page-title mb-0">Quản lý lớp học phần</h1>
        <a class="btn btn-primary" th:href="@{/admin/course-sections/new}">Thêm lớp học phần</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="app-filter-card row g-2 mb-3" method="get" th:action="@{/admin/course-sections}">
        <div class="col-12 col-md-4">
            <label class="form-label" for="section-keyword">Mã lớp hoặc môn học</label>
            <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                   id="section-keyword" placeholder="Mã lớp hoặc môn học">
        </div>
        <div class="col-12 col-md-3">
            <label class="form-label" for="section-semester">Học kỳ</label>
            <select class="form-select" id="section-semester" name="maHocKy">
                <option value="">-- Tất cả học kỳ --</option>
                <option th:each="semester : ${semesters}" th:value="${semester.maHocKy}"
                        th:selected="${semester.maHocKy == maHocKy}"
                        th:text="${semester.tenHocKy + ' - ' + semester.namHoc}"></option>
            </select>
        </div>
        <div class="col-12 col-md-2">
            <label class="form-label" for="section-status">Trạng thái</label>
            <select class="form-select" id="section-status" name="trangThai">
                <option value="">-- Tất cả trạng thái --</option>
                <option value="DRAFT" th:selected="${trangThai == 'DRAFT'}">DRAFT</option>
                <option value="OPEN" th:selected="${trangThai == 'OPEN'}">OPEN</option>
                <option value="CLOSED" th:selected="${trangThai == 'CLOSED'}">CLOSED</option>
                <option value="CANCELLED" th:selected="${trangThai == 'CANCELLED'}">CANCELLED</option>
            </select>
        </div>
        <div class="col-12 col-md-3 align-self-end">
            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/course-sections}">Đặt lại</a>
        </div>
    </form>

    <div class="app-table-card table-responsive">
        <table class="table table-hover align-middle app-data-table">
            <thead>
            <tr>
                <th>Mã lớp học phần</th>
                <th>Môn học</th>
                <th>Học kỳ</th>
                <th>Giảng viên</th>
                <th>Lịch học</th>
                <th>Phòng học</th>
                <th>Sĩ số</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="section : ${courseSections}">
                <td th:text="${section.maLopHocPhan}"></td>
                <td th:text="${section.monHoc.maMonHoc + ' - ' + section.monHoc.tenMonHoc}"></td>
                <td th:text="${section.hocKy.tenHocKy + ' - ' + section.hocKy.namHoc}"></td>
                <td th:text="${section.giangVien != null ? section.giangVien.hoTen : 'Chưa phân công'}"></td>
                <td>
                    <span th:if="${section.thuHoc == null}">Chưa xếp lịch</span>
                    <span th:unless="${section.thuHoc == null}"
                          th:text="${(section.thuHoc == 8 ? 'Chủ nhật' : 'Thứ ' + section.thuHoc)
                            + (section.tietBatDau != null or section.tietKetThuc != null
                                ? ', tiết ' + section.tietBatDau + ' - ' + section.tietKetThuc : '')}"></span>
                </td>
                <td th:text="${section.phongHoc} ?: 'Chưa xếp'"></td>
                <td th:text="${section.siSoHienTai + ' / ' + section.siSoToiDa}"></td>
                <td>
                    <span class="badge app-status"
                          th:classappend="${section.trangThai == 'OPEN'} ? 'bg-success'
                              : (${section.trangThai == 'CANCELLED'} ? 'bg-danger'
                              : (${section.trangThai == 'CLOSED'} ? 'bg-dark' : 'bg-secondary'))"
                          th:text="${section.trangThai}"></span>
                </td>
                <td>
                    <div class="app-actions">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/admin/course-sections/{id}(id=${section.maLopHocPhan})}">Xem</a>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:if="${section.trangThai == 'DRAFT' or section.trangThai == 'OPEN'}"
                           th:href="@{/admin/course-sections/{id}/edit(id=${section.maLopHocPhan})}">Sửa</a>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(courseSections)}">
                <td colspan="9" class="text-center text-muted">Không có lớp học phần nào.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
