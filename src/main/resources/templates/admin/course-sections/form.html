<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lớp học phần</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('sections')}"></div>
<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/course-sections}">Lớp học phần</a></li>
        <li class="breadcrumb-item active" aria-current="page">Biểu mẫu lớp học phần</li>
    </ol></nav>
    <h1 class="h4 mb-3" th:text="${editMode} ? 'Cập nhật lớp học phần' : 'Thêm lớp học phần'"></h1>

    <form method="post" th:object="${courseSectionForm}"
          th:action="${editMode} ? @{/admin/course-sections/{id}/edit(id=${courseSectionId})} : @{/admin/course-sections}">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="maLopHocPhan">Mã lớp học phần</label>
            <input type="text" class="form-control" id="maLopHocPhan" th:field="*{maLopHocPhan}"
                   th:readonly="${editMode}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{maLopHocPhan}"></div>
        </div>

        <div class="mb-3" th:if="${editMode and sectionStatus == 'OPEN'}">
            <label class="form-label">Môn học</label>
            <p class="form-control-plaintext"
               th:text="${currentSubject.maMonHoc + ' - ' + currentSubject.tenMonHoc}"></p>
            <input type="hidden" th:field="*{maMonHoc}">
        </div>
        <div class="mb-3" th:unless="${editMode and sectionStatus == 'OPEN'}">
            <label class="form-label" for="maMonHoc">Môn học</label>
            <select class="form-select" id="maMonHoc" th:field="*{maMonHoc}" th:errorclass="is-invalid">
                <option value="">-- Chọn môn học --</option>
                <option th:each="subject : ${subjects}" th:value="${subject.maMonHoc}"
                        th:text="${subject.trangThai == 'ACTIVE'
                            ? subject.maMonHoc + ' - ' + subject.tenMonHoc
                            : subject.maMonHoc + ' - ' + subject.tenMonHoc + ' (Ngừng hoạt động)'}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{maMonHoc}"></div>
        </div>

        <div class="mb-3" th:if="${editMode and sectionStatus == 'OPEN'}">
            <label class="form-label">Học kỳ</label>
            <p class="form-control-plaintext"
               th:text="${currentSemester.tenHocKy + ' - ' + currentSemester.namHoc}"></p>
            <input type="hidden" th:field="*{maHocKy}">
        </div>
        <div class="mb-3" th:unless="${editMode and sectionStatus == 'OPEN'}">
            <label class="form-label" for="maHocKy">Học kỳ</label>
            <select class="form-select" id="maHocKy" th:field="*{maHocKy}" th:errorclass="is-invalid">
                <option value="">-- Chọn học kỳ --</option>
                <option th:each="semester : ${semesters}" th:value="${semester.maHocKy}"
                        th:text="${semester.tenHocKy + ' - ' + semester.namHoc}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{maHocKy}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="maGV">Giảng viên (không bắt buộc)</label>
            <select class="form-select" id="maGV" th:field="*{maGV}" th:errorclass="is-invalid">
                <option value="">-- Chưa phân công --</option>
                <option th:each="teacher : ${teachers}" th:value="${teacher.maGV}"
                        th:text="${teacher.trangThai == 'ACTIVE'
                            ? teacher.maGV + ' - ' + teacher.hoTen
                            : teacher.maGV + ' - ' + teacher.hoTen + ' (Ngừng hoạt động)'}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{maGV}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="phongHoc">Phòng học</label>
            <input type="text" class="form-control" id="phongHoc" th:field="*{phongHoc}"
                   th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{phongHoc}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="thuHoc">Thứ học</label>
            <select class="form-select" id="thuHoc" th:field="*{thuHoc}" th:errorclass="is-invalid">
                <option value="">-- Chưa xếp lịch --</option>
                <option value="2">Thứ 2</option>
                <option value="3">Thứ 3</option>
                <option value="4">Thứ 4</option>
                <option value="5">Thứ 5</option>
                <option value="6">Thứ 6</option>
                <option value="7">Thứ 7</option>
                <option value="8">Chủ nhật</option>
            </select>
            <div class="invalid-feedback" th:errors="*{thuHoc}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="tietBatDau">Tiết bắt đầu</label>
            <input type="number" class="form-control" id="tietBatDau" th:field="*{tietBatDau}"
                   min="1" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{tietBatDau}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="tietKetThuc">Tiết kết thúc</label>
            <input type="number" class="form-control" id="tietKetThuc" th:field="*{tietKetThuc}"
                   min="1" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{tietKetThuc}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="siSoToiDa">Sĩ số tối đa</label>
            <input type="number" class="form-control" id="siSoToiDa" th:field="*{siSoToiDa}"
                   min="1" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{siSoToiDa}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a class="btn btn-secondary"
           th:href="${editMode} ? @{/admin/course-sections/{id}(id=${courseSectionId})} : @{/admin/course-sections}">Hủy</a>
    </form>
</div>
</body>
</html>
