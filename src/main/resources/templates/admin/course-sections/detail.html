<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết lớp học phần</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('sections')}"></div>
<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/course-sections}">Lớp học phần</a></li>
        <li class="breadcrumb-item active" aria-current="page">Chi tiết lớp học phần</li>
    </ol></nav>
    <h1 class="h4 mb-3">Chi tiết lớp học phần</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <table class="table table-bordered w-auto">
        <tr><th>Mã lớp học phần</th><td th:text="${courseSection.maLopHocPhan}"></td></tr>
        <tr><th>Môn học</th>
            <td th:text="${courseSection.monHoc.maMonHoc + ' - ' + courseSection.monHoc.tenMonHoc}"></td>
        </tr>
        <tr><th>Học kỳ</th>
            <td th:text="${courseSection.hocKy.tenHocKy + ' - ' + courseSection.hocKy.namHoc}"></td>
        </tr>
        <tr><th>Giảng viên</th>
            <td th:text="${courseSection.giangVien != null
                ? courseSection.giangVien.maGV + ' - ' + courseSection.giangVien.hoTen
                : 'Chưa phân công'}"></td>
        </tr>
        <tr><th>Phòng học</th><td th:text="${courseSection.phongHoc} ?: 'Chưa xếp'"></td></tr>
        <tr><th>Thứ học</th>
            <td th:text="${courseSection.thuHoc == null ? 'Chưa xếp lịch'
                : (courseSection.thuHoc == 8 ? 'Chủ nhật' : 'Thứ ' + courseSection.thuHoc)}"></td>
        </tr>
        <tr><th>Tiết bắt đầu</th><td th:text="${courseSection.tietBatDau} ?: 'Chưa xếp'"></td></tr>
        <tr><th>Tiết kết thúc</th><td th:text="${courseSection.tietKetThuc} ?: 'Chưa xếp'"></td></tr>
        <tr><th>Sĩ số hiện tại</th><td th:text="${courseSection.siSoHienTai}"></td></tr>
        <tr><th>Sĩ số tối đa</th><td th:text="${courseSection.siSoToiDa}"></td></tr>
        <tr><th>Trạng thái</th>
            <td><span class="badge bg-secondary" th:text="${courseSection.trangThai}"></span></td>
        </tr>
    </table>

    <div class="d-flex gap-2">
        <a class="btn btn-primary"
           th:if="${courseSection.trangThai == 'DRAFT' or courseSection.trangThai == 'OPEN'}"
           th:href="@{/admin/course-sections/{id}/edit(id=${courseSection.maLopHocPhan})}">Sửa</a>

        <form method="post" th:if="${courseSection.trangThai == 'DRAFT'}"
              th:action="@{/admin/course-sections/{id}/open(id=${courseSection.maLopHocPhan})}">
            <button type="submit" class="btn btn-success">Mở lớp</button>
        </form>
        <form method="post" th:if="${courseSection.trangThai == 'OPEN'}"
              th:action="@{/admin/course-sections/{id}/close(id=${courseSection.maLopHocPhan})}">
            <button type="submit" class="btn btn-warning">Đóng lớp</button>
        </form>
        <form method="post"
              th:if="${courseSection.trangThai == 'DRAFT' or courseSection.trangThai == 'OPEN'}"
              th:action="@{/admin/course-sections/{id}/cancel(id=${courseSection.maLopHocPhan})}">
            <button type="submit" class="btn btn-outline-danger">Hủy lớp</button>
        </form>

        <a class="btn btn-secondary" th:href="@{/admin/course-sections}">Quay lại danh sách lớp học phần</a>
        <a class="btn btn-outline-info"
           th:href="@{/admin/course-sections/{id}/students(id=${courseSection.maLopHocPhan})}">
            Danh sách sinh viên
        </a>
    </div>
</div>
</body>
</html>
