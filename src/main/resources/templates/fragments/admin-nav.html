<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="nav(active)" class="app-admin-header">
    <div class="app-admin-topbar">
        <a class="app-admin-brand" th:href="@{/admin}">Hệ thống Đăng ký Học phần</a>
        <div class="app-admin-header-actions">
            <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#adminSidebar" aria-controls="adminSidebar" aria-expanded="false"
                    aria-label="Mở menu điều hướng">
                Menu
            </button>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Đăng xuất</button>
            </form>
        </div>
    </div>
    <aside id="adminSidebar" class="app-admin-sidebar collapse d-lg-block">
        <nav aria-label="Điều hướng quản trị">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'home'} ? 'active'"
                       th:attr="aria-current=${active == 'home' ? 'page' : null}" th:href="@{/admin}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'students'} ? 'active'"
                       th:attr="aria-current=${active == 'students' ? 'page' : null}"
                       th:href="@{/admin/students}">Sinh viên</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'subjects'} ? 'active'"
                       th:attr="aria-current=${active == 'subjects' ? 'page' : null}"
                       th:href="@{/admin/subjects}">Môn học</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'sections'} ? 'active'"
                       th:attr="aria-current=${active == 'sections' ? 'page' : null}"
                       th:href="@{/admin/course-sections}">Lớp học phần</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'enrollments'} ? 'active'"
                       th:attr="aria-current=${active == 'enrollments' ? 'page' : null}"
                       th:href="@{/admin/enrollments}">Đăng ký</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'semesters'} ? 'active'"
                       th:attr="aria-current=${active == 'semesters' ? 'page' : null}"
                       th:href="@{/admin/semesters}">Học kỳ</a>
                </li>
            </ul>
        </nav>
    </aside>
</header>
</body>
</html>
