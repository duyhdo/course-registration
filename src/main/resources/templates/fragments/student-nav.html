<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="nav(active)" class="app-admin-header">
    <div class="app-admin-topbar">
        <a class="app-admin-brand" th:href="@{/student}">Hệ thống Đăng ký Học phần</a>
        <div class="app-admin-header-actions">
            <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#studentSidebar" aria-controls="studentSidebar" aria-expanded="false"
                    aria-label="Mở menu điều hướng">
                Menu
            </button>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Đăng xuất</button>
            </form>
        </div>
    </div>
    <aside id="studentSidebar" class="app-admin-sidebar collapse d-lg-block">
        <nav aria-label="Điều hướng sinh viên">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'home'} ? 'active'"
                       th:attr="aria-current=${active == 'home' ? 'page' : null}" th:href="@{/student}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'profile'} ? 'active'"
                       th:attr="aria-current=${active == 'profile' ? 'page' : null}"
                       th:href="@{/student/profile}">Thông tin cá nhân</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'register'} ? 'active'"
                       th:attr="aria-current=${active == 'register' ? 'page' : null}"
                       th:href="@{/student/course-sections}">Đăng ký học phần</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'registrations'} ? 'active'"
                       th:attr="aria-current=${active == 'registrations' ? 'page' : null}"
                       th:href="@{/student/registrations}">Học phần đã đăng ký</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'history'} ? 'active'"
                       th:attr="aria-current=${active == 'history' ? 'page' : null}"
                       th:href="@{/student/enrollment-history}">Lịch sử đăng ký</a>
                </li>
            </ul>
        </nav>
    </aside>
</header>
</body>
</html>
